<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worker Productivity Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        header {
            background: white;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #666;
            font-size: 14px;
        }
        
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
        }
        
        .card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .card h2 {
            color: #333;
            font-size: 18px;
            margin-bottom: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        
        .worker-card {
            border-left: 4px solid #667eea;
        }
        
        .worker-info {
            margin-bottom: 15px;
        }
        
        .worker-name {
            font-weight: bold;
            color: #333;
            font-size: 16px;
        }
        
        .worker-id {
            color: #999;
            font-size: 12px;
        }
        
        .metric-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }
        
        .metric-item:last-child {
            border-bottom: none;
        }
        
        .metric-label {
            color: #666;
            font-size: 14px;
        }
        
        .metric-value {
            color: #333;
            font-weight: bold;
        }
        
        .productivity-score {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .score-high {
            background: #d4edda;
            color: #155724;
        }
        
        .score-medium {
            background: #fff3cd;
            color: #856404;
        }
        
        .score-low {
            background: #f8d7da;
            color: #721c24;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        
        .stat-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }
        
        .stat-label {
            color: #666;
            font-size: 12px;
            margin-top: 5px;
        }
        
        .loading {
            text-align: center;
            color: #999;
            padding: 20px;
        }
        
        .error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏭 Worker Productivity Dashboard</h1>
            <p class="subtitle">Real-time monitoring of factory worker activity and productivity metrics</p>
        </header>
        
        <div id="app"></div>
    </div>
    
    <script>
        const API_URL = 'http://localhost:5000/api';
        
        async function loadDashboard() {
            try {
                const response = await fetch(`${API_URL}/dashboard`);
                const data = await response.json();
                renderDashboard(data);
            } catch (error) {
                console.error('Error loading dashboard:', error);
                document.getElementById('app').innerHTML = `
                    <div class="error">
                        ⚠️ Error loading dashboard. Make sure the backend server is running on port 5000.
                    </div>
                `;
            }
        }
        
        function renderDashboard(data) {
            const app = document.getElementById('app');
            
            let html = '<div class="dashboard">';
            
            // Summary stats
            html += `
                <div class="card">
                    <h2>Factory Overview</h2>
                    <div class="stats-grid">
                        <div class="stat-box">
                            <div class="stat-value">${data.workers.length}</div>
                            <div class="stat-label">Active Workers</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-value">${data.total_events}</div>
                            <div class="stat-label">Total Events</div>
                        </div>
                    </div>
                </div>
            `;
            
            // Worker cards
            data.workers.forEach(worker => {
                const scoreClass = worker.productivity_score >= 0.8 ? 'score-high' : 
                                  worker.productivity_score >= 0.6 ? 'score-medium' : 'score-low';
                const scoreText = worker.productivity_score ? (worker.productivity_score * 100).toFixed(0) + '%' : 'N/A';
                
                html += `
                    <div class="card worker-card">
                        <h2>Worker Details</h2>
                        <div class="worker-info">
                            <div class="worker-name">${worker.name}</div>
                            <div class="worker-id">ID: ${worker.worker_id}</div>
                        </div>
                        <div class="metric-item">
                            <span class="metric-label">Productivity Score</span>
                            <span class="metric-value productivity-score ${scoreClass}">${scoreText}</span>
                        </div>
                        <div class="metric-item">
                            <span class="metric-label">Last Update</span>
                            <span class="metric-value">${worker.date || 'No data'}</span>
                        </div>
                    </div>
                `;
            });
            
            html += '</div>';
            app.innerHTML = html;
        }
        
        // Load dashboard on page load
        loadDashboard();
        
        // Refresh every 10 seconds
        setInterval(loadDashboard, 10000);
    </script>
</body>
</html>
